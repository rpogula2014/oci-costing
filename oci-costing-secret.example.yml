# Template — DO NOT COMMIT real secret. Generate via deploy/k8s/make-secret.sh.
#
# ClickHouse only. OCI Object Storage auth comes from OKE Workload Identity at
# runtime — no API key / private key in this secret.
apiVersion: v1
kind: Secret
metadata:
  name: oci-costing-secret
  namespace: oci-finops
type: Opaque
stringData:
  # ClickHouse DSN (native proto 9000 or https 8443 — ParseDSN handles both)
  clickhouse_url: "clickhouse://REPLACE_USER:REPLACE_PW@REPLACE_HOST:9000/ocianalytics"

  oci_pgsql_ca: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_OCI_PG_ROOT_CERT
    -----END CERTIFICATE-----
